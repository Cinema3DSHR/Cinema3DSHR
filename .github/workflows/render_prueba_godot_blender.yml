name: Render de la prueba Godot → Blender (casa en tormenta)

# Arma la escena desde cero (Godot → GLB → Blender, los scripts de pruebas/godot_blender) en UN trabajo, reparte los
# 900 cuadros entre trabajos simultáneos de Cycles y publica el MP4 en la release. Sólo a mano, por orden del dueño
# en el chat (candado del render quitado: config/candado_render.json → "activo": false).
on:
  workflow_dispatch:
    inputs:
      ancho: {description: "Ancho en píxeles", required: false, default: "720"}
      alto: {description: "Alto en píxeles", required: false, default: "1280"}
      muestras: {description: "Muestras de Cycles", required: false, default: "6"}
      trabajos: {description: "Trabajos de render en paralelo (máx. 60)", required: false, default: "60"}
      etiqueta: {description: "Tag de la release", required: false, default: "prueba_godot_blender"}
      nombre: {description: "Nombre del MP4 (sin extensión)", required: false, default: "casa_tormenta_720p"}

permissions:
  contents: write

concurrency:
  group: render-prueba-godot-blender
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      trozos: ${{ steps.plan.outputs.trozos }}
      inicio: ${{ steps.plan.outputs.inicio }}
    steps:
      - uses: actions/checkout@v4
      - name: Candado del render (con candado puesto, este flujo no corre)
        run: |
          python3 -c "import json,sys; c=json.load(open('config/candado_render.json')); sys.exit('::error::Candado del render PUESTO: hace falta APROBAR + AUTORIZAR en la app' if c.get('activo') else 0)"
          echo "candado QUITADO: render por orden del dueño en el chat"
      - name: Repartir los 900 cuadros
        id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, datetime
          total, n = 900, max(1, min(60, int("${{ inputs.trabajos }}")))
          tam = math.ceil(total / n)
          t = [{"n": f"{i:02d}", "desde": d, "hasta": min(total, d + tam - 1)} for i, d in enumerate(range(1, total + 1, tam))]
          assert sum(x["hasta"] - x["desde"] + 1 for x in t) == total
          print("trozos=" + json.dumps(t)); print("inicio=" + datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
      - name: La Kodiak de Dream Racing (repositorio público)
        uses: actions/checkout@v4
        with:
          repository: webmaletin-art/Rally-Sim-movile
          ref: main
          path: recursos/rally
          sparse-checkout: |
            godot/game/models/cars/kodiak.glb
            godot/game/models/cars/kodiak_lo.glb
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-produccion.txt}
      - name: Godot 4.7.2, Blender (bpy) y bibliotecas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q -r requirements-produccion.txt
          V=4.7.2
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot && sudo ln -sf /tmp/godot/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Godot → GLB
        working-directory: pruebas/godot_blender/godot
        run: |
          mkdir -p modelos && cp ../../../recursos/rally/godot/game/models/cars/kodiak*.glb modelos/
          godot --headless --import >/dev/null 2>&1 || true
          godot --headless --path . -s herramientas/construir.gd 2>&1 | grep -E "glb:|tscn:|TIEMPOS|ERROR"
          test -s salida/casa_tormenta.glb
      - name: GLB → Blender (.blend con efectos y Cycles)
        working-directory: pruebas/godot_blender
        run: python blender/armar.py godot/salida/casa_tormenta.glb blender/casa_tormenta.blend 2>&1 | grep -vE "^[0-9]{2}:[0-9]{2}" | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: blend
          path: |
            pruebas/godot_blender/blender/casa_tormenta.blend
            pruebas/godot_blender/blender/casa_tormenta.json
          retention-days: 14

  render:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        trozo: ${{ fromJSON(needs.preparar.outputs.trozos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-produccion.txt}
      - name: Blender (bpy)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q -r requirements-produccion.txt
      - uses: actions/download-artifact@v4
        with: {name: blend, path: escena}
      - name: Renderizar cuadros ${{ matrix.trozo.desde }}–${{ matrix.trozo.hasta }}
        run: |
          python pruebas/godot_blender/blender/render_trozo.py escena/casa_tormenta.blend ${{ matrix.trozo.desde }} ${{ matrix.trozo.hasta }} \
            ${{ inputs.ancho }} ${{ inputs.alto }} ${{ inputs.muestras }} out 2>&1 | grep -E "^cuadro|Error|Traceback"
          ls out/f_*.png | wc -l
      - name: Empaquetar
        run: cd out && zip -0 -q "../frames_${{ matrix.trozo.n }}.zip" f_*.png informe_*.json
      - uses: actions/upload-artifact@v4
        with: {name: "frames-${{ matrix.trozo.n }}", path: "frames_${{ matrix.trozo.n }}.zip", compression-level: 0, retention-days: 14}

  montar:
    needs: [preparar, render]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: {pattern: "frames-*", path: descargas}
      - name: Reunir, rellenar faltantes (si los hay, se informan) y codificar
        run: |
          mkdir -p frames salida && for z in descargas/frames-*/frames_*.zip; do unzip -q -o "$z" -d frames; done
          python3 - <<'PY'
          import json, shutil, glob, datetime
          from pathlib import Path
          F = Path("frames"); falt = [n for n in range(1, 901) if not (F / f"f_{n:04d}.png").exists()]
          for n in falt:
              k = n - 1
              while k > 0 and not (F / f"f_{k:04d}.png").exists(): k -= 1
              if k == 0:
                  k = min(m for m in range(1, 901) if (F / f"f_{m:04d}.png").exists())
              shutil.copy(F / f"f_{k:04d}.png", F / f"f_{n:04d}.png")
          med = [json.load(open(p))["media_s"] for p in glob.glob("frames/informe_*.json")]
          inf = {"cuadros": 900, "rellenados": falt, "trabajos_con_informe": len(med),
                 "s_por_cuadro_media": round(sum(med) / len(med), 2) if med else None,
                 "inicio": "${{ needs.preparar.outputs.inicio }}", "fin": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "resolucion": "${{ inputs.ancho }}x${{ inputs.alto }}", "muestras": ${{ inputs.muestras }}}
          json.dump(inf, open("salida/informe_render.json", "w"), indent=1); print(inf)
          PY
          ffmpeg -v error -y -framerate 30 -start_number 1 -i frames/f_%04d.png -c:v libx264 -crf 18 -preset slow -pix_fmt yuv420p -movflags +faststart "salida/${{ inputs.nombre }}.mp4"
          ffprobe -v error -show_entries stream=width,height,nb_frames -of csv "salida/${{ inputs.nombre }}.mp4"
      - name: Publicar en la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}; T="${{ inputs.etiqueta }}"
          gh release view "$T" --repo "$R" >/dev/null 2>&1 || gh release create "$T" --repo "$R" --latest=false --title "$T" --notes "Prueba técnica Godot → Blender (pruebas/godot_blender/INFORME.md)."
          gh release upload "$T" "salida/${{ inputs.nombre }}.mp4" salida/informe_render.json --repo "$R" --clobber
      - uses: actions/upload-artifact@v4
        with: {name: entrega, path: salida/, retention-days: 14}
