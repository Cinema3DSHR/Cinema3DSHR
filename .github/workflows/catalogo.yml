name: Catálogo para la app

# Reconstruye catalogo.json (lo único que la app consulta para saber si hay novedades) desde:
# manifiestos del repositorio + entregables publicados (Releases) + decisiones de revisión (Issues del dueño).
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            estudio
            producciones
            escenarios
            config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Releases, revisiones e informes de render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh api "repos/$R/releases?per_page=100" --paginate | jq -s 'add // []' > releases.json
          gh api "repos/$R/issues?state=all&per_page=100" --paginate | jq -s 'add // []' > issues.json
          mkdir -p infos
          jq -r '.[] | .tag_name as $t | .assets[] | select(.name|endswith("_info.json")) | "\($t) \(.name) \(.browser_download_url)"' releases.json |
          while read -r tag name url; do
            mkdir -p "infos/$tag"; curl -sfL "$url" -o "infos/$tag/$name" || true
          done
      - name: Construir catálogo
        run: python -m estudio catalogo --releases releases.json --issues issues.json --infos infos --salida catalogo.json
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release view catalogo --repo "$R" >/dev/null 2>&1 || \
            gh release create catalogo --repo "$R" --title "Catálogo" --latest=false --notes "catalogo.json: índice que consulta la app Android. Se regenera solo."
          gh release upload catalogo catalogo.json --repo "$R" --clobber
          jq '.resumen' catalogo.json
