name: Incorporar BLEND aprobado (modalidad 2 → Release → render automático)

# MODALIDAD 2 del pipeline (docs/CONSTRUIR_Y_RENDERIZAR.md): un .blend autónomo YA PREPARADO en Blender y APROBADO por
# el dueño se publica TAL CUAL y se renderiza. No instala Godot, no corre el AutoFinisher, no reconstruye ni modifica
# nada: la identidad del archivo es su SHA-256, registrado en el repo al aprobarlo
# (`python -m estudio.autofinisher aprobar-blend` → producciones/<p>/versiones/v<NNN>.aprobacion.json).
#   1. lee el registro de aprobación y comprueba que la versión sea nueva (si su Release existe, se detiene);
#   2. baja el .blend desde su origen (Release de entrada o URL) y verifica tamaño y SHA-256 contra el registro;
#   3. lo inspecciona en sólo lectura: autónomo, cámara, rango y perfil de producción 720p (si algo no cumple, se
#      detiene y lo informa: no se corrige porque eso cambiaría lo aprobado);
#   4. arma la versión (copia byte a byte + manifest.json «blend_externo» con ajustes bloqueados) y la valida;
#   5. publica la Release «blend-<p>-v<NNN>» y llama al render (render_desde_blend.yml): el MP4 queda en la misma Release.
# La frase del dueño ya está en el registro: no hay una segunda aprobación en GitHub. Sólo a mano.
on:
  workflow_dispatch:
    inputs:
      aprobacion: {description: "Registro de aprobación del repo (producciones/<p>/versiones/v<NNN>.aprobacion.json)", required: true}
      origen: {description: "De dónde bajar el .blend: release:<tag>/<archivo> o url:<https://…>", required: true}
      publicar: {description: "Publicar la versión en su Release (false = sólo artefacto para revisar)", required: false, default: "true"}
      renderizar: {description: "Llamar al render apenas se publica (requiere publicar=true)", required: false, default: "true"}
      trabajos: {description: "Trabajos de render (máx. 60)", required: false, default: "60"}

permissions:
  contents: write
  actions: read

concurrency:
  group: incorporar-${{ inputs.aprobacion }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  APROB: ${{ inputs.aprobacion }}

jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      produccion: ${{ steps.reg.outputs.produccion }}
      version: ${{ steps.reg.outputs.version }}
      id: ${{ steps.reg.outputs.id }}
      tag: ${{ steps.reg.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-produccion.txt}

      - name: Registro de aprobación y versión nueva
        id: reg
        run: |
          set -e
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from estudio.autofinisher import blend_externo as BE
          reg = json.load(open(os.environ["APROB"]))
          e = BE.errores_registro(reg)
          assert not e, "registro de aprobación inválido: " + "; ".join(e)
          print(f"produccion={reg['produccion']}"); print(f"version={reg['version']}"); print(f"id={reg['id']}")
          print(f"tag={reg['release']}"); print(f"sha={reg['blend']['sha256']}"); print(f"bytes={reg['blend']['bytes']}")
          PY
          grep -E "^(produccion|version|id|tag|sha|bytes)=" "$GITHUB_OUTPUT"
          TAG=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::La Release $TAG ya existe: una versión publicada no se sobrescribe."; exit 1
          fi

      - name: Blender (bpy) — sin Godot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q -r requirements-produccion.txt

      - name: Bajar el .blend aprobado y verificar su SHA-256 contra el registro
        env:
          ORIGEN: ${{ inputs.origen }}
          SHA: ${{ steps.reg.outputs.sha }}
        run: |
          set -e
          mkdir -p entrada
          case "$ORIGEN" in
            release:*)
              R="${ORIGEN#release:}"; TAGE="${R%%/*}"; ARCH="${R#*/}"
              gh release download "$TAGE" --repo "$REPO" -p "$ARCH" -D entrada
              mv "entrada/$ARCH" entrada/aprobado.blend ;;
            url:*)
              python3 -m estudio.autofinisher descargar --url "${ORIGEN#url:}" --destino entrada/aprobado.blend --sha256 "$SHA" ;;
            *) echo "::error::origen debe empezar con release: o url:"; exit 1 ;;
          esac
          python3 - <<'PY'
          import json, os, sys
          from estudio.autofinisher import blend_externo as BE
          ok, motivo = BE.verificar_contra_registro(json.load(open(os.environ["APROB"])), "entrada/aprobado.blend")
          print(motivo)
          sys.exit(0 if ok else "::error::El archivo recibido NO es el aprobado: " + motivo)
          PY

      - name: Incorporar (inspección de sólo lectura + copia byte a byte + manifiesto)
        run: |
          set -e
          python -m estudio.autofinisher incorporar --blend entrada/aprobado.blend --aprobacion "$APROB" \
            --salida "dist/${{ steps.reg.outputs.id }}" 2>&1 | grep -vE "^[0-9]{2}:[0-9]{2}\.[0-9]+ " | tail -15
          ls -la "dist/${{ steps.reg.outputs.id }}"

      - name: Validar la versión contra su manifiesto (sin render)
        run: |
          set -e
          D="dist/${{ steps.reg.outputs.id }}"
          python -m estudio.autofinisher validar --blend "$D/${{ steps.reg.outputs.id }}.blend" --manifiesto "$D/manifest.json" \
            2>&1 | grep -vE "^[0-9]{2}:[0-9]{2}\.[0-9]+ " | tail -25

      - uses: actions/upload-artifact@v4
        with: {name: "version-${{ steps.reg.outputs.id }}", path: dist/, retention-days: 14}

      - name: Publicar la versión en su Release (inmutable)
        if: ${{ inputs.publicar == 'true' }}
        run: |
          set -e
          D="dist/${{ steps.reg.outputs.id }}"; TAG="${{ steps.reg.outputs.tag }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::La Release $TAG apareció mientras se incorporaba: no se sobrescribe."; exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --latest=false --title "${{ steps.reg.outputs.id }}" \
            --notes "Versión ${{ steps.reg.outputs.id }} — BLEND externo APROBADO por el dueño (modalidad 2, sin reconstruir). .blend SHA-256 ${{ steps.reg.outputs.sha }}. Registro: $APROB. Inmutable; el MP4 final se suma a esta Release." \
            "$D/${{ steps.reg.outputs.id }}.blend" "$D/manifest.json" "$D/informe_preparacion.json" "$D/aprobacion.json"

  render:
    needs: incorporar
    if: ${{ inputs.publicar == 'true' && inputs.renderizar == 'true' }}
    uses: ./.github/workflows/render_desde_blend.yml
    with:
      produccion: ${{ needs.incorporar.outputs.produccion }}
      version: ${{ needs.incorporar.outputs.version }}
      trabajos: ${{ inputs.trabajos }}
      nombre_mp4: ${{ needs.incorporar.outputs.id }}_final
      release_destino: ${{ needs.incorporar.outputs.tag }}
