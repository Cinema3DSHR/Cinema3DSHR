name: Construir producción (Godot → GLB → AutoFinisher → .blend → Release)

# CONSTRUCCIÓN + PUBLICACIÓN de UNA versión (docs/CONSTRUIR_Y_RENDERIZAR.md). No renderiza nada.
# Arma la escena en Godot, exporta el GLB, corre el AutoFinisher (estudio/autofinisher), valida el .blend autónomo,
# genera el manifiesto con los SHA-256 y publica la versión en su Release propia «blend-<produccion>-v<NNN>».
# Una versión publicada es INMUTABLE: si la Release ya existe, el flujo se detiene (cualquier cambio = versión nueva).
# Sólo a mano: cuando hay una versión nueva o el dueño pide expresamente una reconstrucción.
on:
  workflow_dispatch:
    inputs:
      receta: {description: "Receta de terminación (JSON del repo), p. ej. pruebas/autofinisher/casa_tormenta.receta.json", required: true}
      version: {description: "Número de versión NUEVO (entero; no puede existir su Release)", required: true}
      publicar: {description: "Publicar en GitHub Releases (false = sólo artefacto temporal para revisar)", required: false, default: "true"}

permissions:
  contents: write

concurrency:
  group: construir-${{ inputs.receta }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RECETA: ${{ inputs.receta }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-produccion.txt}

      - name: Leer la receta y comprobar que la versión es nueva
        id: receta
        run: |
          set -e
          echo "inicio=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          python3 -m estudio.autofinisher receta --receta "$RECETA" > receta_completa.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from estudio.autofinisher import manifiesto as MF
          r = json.load(open("receta_completa.json")); v = int(os.environ["VERSION"]); g = r.get("godot", {})
          assert v >= 1, "la versión es un entero ≥ 1"
          for k in ("proyecto", "script", "glb"):
              assert g.get(k), f"la receta no dice godot.{k}"
          print(f"produccion={r['produccion']}"); print(f"tag={MF.tag_release(r['produccion'], v)}")
          print(f"id={MF.id_version(r['produccion'], v)}"); print(f"godot={g.get('version', '4.7.2')}")
          print(f"proyecto={g['proyecto']}"); print(f"script={g['script']}"); print(f"glb={g['glb']}")
          print("args=" + " ".join(g.get("args", [])))
          PY
          TAG=$(grep '^tag=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::La Release $TAG ya existe: una versión publicada no se sobrescribe. Usá una versión nueva."
            exit 1
          fi
          echo "versión nueva: $TAG"

      - name: Godot ${{ steps.receta.outputs.godot }}, Blender (bpy) y bibliotecas
        run: |
          set -e
          t=$(date +%s)
          sudo apt-get update -qq && sudo apt-get install -y -qq libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q -r requirements-produccion.txt
          V=${{ steps.receta.outputs.godot }}
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot && sudo ln -sf /tmp/godot/Godot_v${V}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          echo "{\"instalar_s\": $(( $(date +%s) - t ))}" > t_instalar.json

      - name: Recursos externos de la receta
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: python3 -m estudio.autofinisher.recursos --receta "$RECETA" | tee recursos.json

      - name: Godot → GLB
        run: |
          set -e
          t=$(date +%s)
          cd "${{ steps.receta.outputs.proyecto }}"
          godot --headless --import >/dev/null 2>&1 || true
          godot --headless --path . -s "${{ steps.receta.outputs.script }}" -- ${{ steps.receta.outputs.args }} 2>&1 | grep -E "glb:|TIEMPOS|ERROR" || true
          test -s "${{ steps.receta.outputs.glb }}"
          ls -la "${{ steps.receta.outputs.glb }}"
          echo "{\"godot_s\": $(( $(date +%s) - t ))}" > "$GITHUB_WORKSPACE/t_godot.json"

      - name: AutoFinisher → .blend autónomo + manifiesto
        run: |
          set -e
          python -m estudio.autofinisher construir --receta "$RECETA" \
            --glb "${{ steps.receta.outputs.proyecto }}/${{ steps.receta.outputs.glb }}" \
            --version "$VERSION" --salida "dist/${{ steps.receta.outputs.id }}" --godot "${{ steps.receta.outputs.godot }}" \
            2>&1 | grep -vE "^[0-9]{2}:[0-9]{2}\.[0-9]+ " | tail -20
          ls -la "dist/${{ steps.receta.outputs.id }}"

      - name: Validar el .blend contra su manifiesto (sin render)
        run: |
          set -e
          D="dist/${{ steps.receta.outputs.id }}"
          python -m estudio.autofinisher validar --blend "$D/${{ steps.receta.outputs.id }}.blend" --manifiesto "$D/manifest.json" \
            2>&1 | grep -vE "^[0-9]{2}:[0-9]{2}\.[0-9]+ " | tail -25

      - name: Tiempos de la construcción
        run: |
          python3 - <<'PY'
          import json, time, glob
          t = {}
          for f in ("t_instalar.json", "t_godot.json"):
              t.update(json.load(open(f)))
          inf = json.load(open(glob.glob("dist/*/informe_preparacion.json")[0]))
          t["autofinisher_s"] = inf["segundos_total"]; t["autofinisher_ram_max_mb"] = inf["ram_max_mb"]
          t["recursos"] = json.load(open("recursos.json"))
          t["total_hasta_publicar_s"] = int(time.time()) - int("${{ steps.receta.outputs.inicio }}")
          json.dump(t, open("dist/tiempos_construccion.json", "w"), indent=1)
          print(json.dumps(t, indent=1))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: version-${{ steps.receta.outputs.id }}
          path: dist/
          retention-days: 14

      - name: Publicar la versión en su Release (inmutable)
        if: ${{ inputs.publicar == 'true' }}
        run: |
          set -e
          D="dist/${{ steps.receta.outputs.id }}"
          TAG="${{ steps.receta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::La Release $TAG apareció mientras se construía: no se sobrescribe."; exit 1
          fi
          t=$(date +%s)
          SHA=$(python3 -c "import json; print(json.load(open('$D/manifest.json'))['archivos']['blend']['sha256'])")
          gh release create "$TAG" --repo "${{ github.repository }}" --latest=false \
            --title "${{ steps.receta.outputs.id }}" \
            --notes "Versión ${{ steps.receta.outputs.id }} (AutoFinisher). .blend SHA-256 $SHA. Receta: $RECETA. Inmutable: cualquier cambio es una versión nueva." \
            "$D/${{ steps.receta.outputs.id }}.blend" "$D/${{ steps.receta.outputs.id }}.glb" "$D/manifest.json" \
            "$D/informe_preparacion.json" dist/tiempos_construccion.json
          echo "subida: $(( $(date +%s) - t )) s"
