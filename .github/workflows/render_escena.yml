name: Render de escena publicada (BLEND → Cycles en paralelo → montar.py con audio intacto → MP4)

# Etapa 5 del flujo definitivo (docs/FLUJO_DEFINITIVO.md). Lo dispara solo «Publicar escena aprobada» al terminar de
# publicar la Release de la versión; no pide ninguna otra aprobación. A mano (workflow_dispatch) sirve sólo para
# RECUPERAR cuadros que fallaron (`cuadros` + `corrida_previa`) o repetir el render de la misma versión publicada.
# Nunca reconstruye la escena ni instala Godot: cada trabajo baja el BLEND de la Release y verifica su SHA-256; el
# montaje baja el WAV de la MISMA versión, verifica su SHA-256 y lo pone tal cual (sin normalizar, sin cortar).
on:
  workflow_call:
    inputs:
      tag: {type: string, required: true}
      trabajos: {type: string, required: false, default: "60"}
      cuadros: {type: string, required: false, default: ""}
      corrida_previa: {type: string, required: false, default: ""}
  workflow_dispatch:
    inputs:
      tag: {description: "Release de la versión publicada (escena-<produccion>-<escena>-v<NNN>)", required: true}
      trabajos: {description: "Trabajos en paralelo (máx. 60)", required: false, default: "60"}
      cuadros: {description: "RECUPERACIÓN: sólo estos cuadros (p. ej. 12,40-45); vacío = todos", required: false, default: ""}
      corrida_previa: {description: "RECUPERACIÓN: número de la corrida anterior cuyos cuadros se suman", required: false, default: ""}

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag }}

jobs:
  planificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      trozos: ${{ steps.plan.outputs.trozos }}
      blend: ${{ steps.plan.outputs.blend }}
      total: ${{ steps.plan.outputs.total }}
      ancho: ${{ steps.plan.outputs.ancho }}
      alto: ${{ steps.plan.outputs.alto }}
      fps: ${{ steps.plan.outputs.fps }}
      muestras: ${{ steps.plan.outputs.muestras }}
      crf: ${{ steps.plan.outputs.crf }}
      mp4: ${{ steps.plan.outputs.mp4 }}
      solicitados: ${{ steps.plan.outputs.solicitados }}
      inicio: ${{ steps.plan.outputs.inicio }}
    steps:
      - uses: actions/checkout@v4
      - name: Candado del render (si el dueño lo vuelve a poner, este flujo no corre)
        run: python3 -c "import json,sys; c=json.load(open('config/candado_render.json')); sys.exit('::error::Candado del render PUESTO (config/candado_render.json)' if c.get('activo', True) else 0)"
      - name: Manifiesto de la versión y reparto de cuadros
        id: plan
        env:
          IN_TRABAJOS: ${{ inputs.trabajos }}
          IN_CUADROS: ${{ inputs.cuadros }}
        run: |
          set -e
          gh release download "$TAG" --repo "$REPO" -p manifest.json -D manif || { echo "::error::No existe la versión publicada $TAG (o no tiene manifest.json)"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, sys
          from estudio import version_escena as VE
          from estudio.autofinisher import reparto as RP
          m = VE.leer("manif/manifest.json")
          if not m.get("completo") or m.get("ensayo"):
              print("::error::la versión no está completa o es un ensayo: no se renderiza", file=sys.stderr); sys.exit(1)
          if m["release"] != os.environ["TAG"]:
              print(f"::error::el manifiesto es de {m['release']}, no de {os.environ['TAG']}", file=sys.stderr); sys.exit(1)
          r = m["render"]; total = r["cuadros"]; nb = VE.nombres(m)
          lista = os.environ["IN_CUADROS"].strip()
          t = RP.repartir_lista(RP.parse_lista(lista, total), int(os.environ["IN_TRABAJOS"])) if lista \
              else RP.repartir(total, int(os.environ["IN_TRABAJOS"]))
          print(f"trozos={json.dumps(t)}"); print(f"blend={m['archivos']['blend']['nombre']}"); print(f"total={total}")
          print(f"ancho={r['resolucion'][0]}"); print(f"alto={r['resolucion'][1]}"); print(f"fps={r['fps']}")
          print(f"muestras={r['muestras']}"); print(f"crf={r.get('crf', 22)}"); print(f"mp4={nb['mp4'][:-4]}")
          print(f"solicitados={len(t)}"); print("inicio=" + datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          grep -E "^(blend|total|ancho|alto|fps|muestras|mp4|solicitados)=" "$GITHUB_OUTPUT"
          MP4=$(grep '^mp4=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -qx "$MP4.mp4"; then
            echo "::error::$TAG ya tiene $MP4.mp4: el video final no se sobrescribe"; exit 1
          fi

  render:
    needs: planificar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        trozo: ${{ fromJSON(needs.planificar.outputs.trozos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-produccion.txt}
      - name: Blender (bpy) — sin Godot, sin reconstruir la escena
        run: |
          t=$(date +%s)
          sudo apt-get update -qq && sudo apt-get install -y -qq libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 >/dev/null
          pip install -q -r requirements-produccion.txt
          echo "{\"instalar_s\": $(( $(date +%s) - t ))}" > t_instalar.json
      - name: Bajar el BLEND publicado y verificar su SHA-256
        run: |
          set -e
          t=$(date +%s.%N)
          gh release download "$TAG" --repo "$REPO" -p "${{ needs.planificar.outputs.blend }}" -p manifest.json -D escena
          python3 -c "import json,os,time; s=os.path.getsize('escena/${{ needs.planificar.outputs.blend }}'); d=time.time()-float('$t'); json.dump({'descarga_s': round(d,2), 'blend_mb': round(s/1e6,2)}, open('t_descarga.json','w'))"
          python3 -m estudio.autofinisher verificar-blend --manifiesto escena/manifest.json --blend "escena/${{ needs.planificar.outputs.blend }}"
      - name: Renderizar cuadros ${{ matrix.trozo.desde }}–${{ matrix.trozo.hasta }}
        run: |
          set -o pipefail      # el código de salida es el de Blender, no el del filtro
          R=0
          if [ -n "${{ matrix.trozo.cuadros }}" ]; then SEL="--cuadros ${{ matrix.trozo.cuadros }}"; else SEL="--desde ${{ matrix.trozo.desde }} --hasta ${{ matrix.trozo.hasta }}"; fi
          python -m estudio.autofinisher render-trozo --blend "escena/${{ needs.planificar.outputs.blend }}" --manifiesto escena/manifest.json \
            $SEL --ancho ${{ needs.planificar.outputs.ancho }} --alto ${{ needs.planificar.outputs.alto }} \
            --muestras ${{ needs.planificar.outputs.muestras }} --reintentos 1 --salida out 2>&1 \
            | grep -E "^cuadro|FALLO|reintento|Error|Traceback|RENDER DETENIDO" || R=$?
          python3 - <<'PY'
          import glob, json
          for p in glob.glob("out/informe_*.json"):
              d = json.load(open(p))
              for f in ("t_instalar.json", "t_descarga.json"):
                  d.update(json.load(open(f)))
              d["trabajo"] = "${{ matrix.trozo.n }}"
              json.dump(d, open(p, "w"), indent=1)
          PY
          ls out/f_*.png 2>/dev/null | wc -l
          exit $R
      - name: Empaquetar
        if: ${{ always() }}
        run: cd out && zip -0 -q "../frames_${{ matrix.trozo.n }}.zip" f_*.png informe_*.json || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: "frames-${{ matrix.trozo.n }}", path: "frames_${{ matrix.trozo.n }}.zip", compression-level: 0, retention-days: 14}

  montar:
    needs: [planificar, render]
    if: ${{ !cancelled() && needs.planificar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg y numpy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy >/dev/null
      - uses: actions/download-artifact@v4
        with: {pattern: "frames-*", path: descargas}
      - name: RECUPERACIÓN explícita — sumar los cuadros de la corrida previa
        if: ${{ inputs.corrida_previa != '' }}
        run: |
          set -e
          gh run download "${{ inputs.corrida_previa }}" --repo "$REPO" -p "frames-*" -D previa
          echo "recuperación: se suman los cuadros de la corrida ${{ inputs.corrida_previa }} (los nuevos tienen prioridad)"
      - name: Reunir los cuadros y verificar que estén TODOS (no se rellena nada)
        run: |
          mkdir -p frames
          for z in previa/frames-*/frames_*.zip; do [ -f "$z" ] && unzip -q -o "$z" -d frames; done
          for z in descargas/frames-*/frames_*.zip; do [ -f "$z" ] && unzip -q -o "$z" -d frames; done
          python3 -m estudio.autofinisher verificar-cuadros --carpeta frames --total ${{ needs.planificar.outputs.total }} > verificacion.json || true
          cat verificacion.json
          python3 -c "import json,sys; v=json.load(open('verificacion.json')); sys.exit(0 if v['completo'] else '::error::FALTAN CUADROS: ' + v['faltan_texto'] + ' — no se monta. Recuperar con «Render de escena publicada»: tag=$TAG, cuadros=' + v['faltan_texto'] + ', corrida_previa=${{ github.run_id }}')"
      - name: Bajar el WAV y la receta de la MISMA versión y verificar sus SHA-256
        run: |
          set -e
          gh release download "$TAG" --repo "$REPO" -p manifest.json -p "*.wav" -p "*_escena.json" -D version
          python3 - <<'PY'
          import json, sys
          from estudio import version_escena as VE
          m = VE.leer("version/manifest.json")
          for k in ("wav", "escena"):
              ok, motivo = VE.verificar(m, k, "version/" + m["archivos"][k]["nombre"])
              print(("OK " if ok else "::error::") + motivo)
              if not ok: sys.exit(1)
          PY
      - name: montar.py con el audio intacto → MP4 final
        run: |
          set -e
          WAV=$(ls version/*.wav); REC=$(ls version/*_escena.json)
          python3 pruebas/video_30s/montar.py frames "$WAV" salida --total ${{ needs.planificar.outputs.total }} \
            --fps ${{ needs.planificar.outputs.fps }} --audio-intacto --crf ${{ needs.planificar.outputs.crf }} \
            --nombre "${{ needs.planificar.outputs.mp4 }}" --escena "$REC" --run-iniciado "${{ needs.planificar.outputs.inicio }}"
      - name: Verificar el MP4 (cuadros, resolución, fps, duración)
        run: |
          set -e
          python3 -m estudio.autofinisher verificar-video --mp4 "salida/${{ needs.planificar.outputs.mp4 }}.mp4" --ancho ${{ needs.planificar.outputs.ancho }} \
            --alto ${{ needs.planificar.outputs.alto }} --fps ${{ needs.planificar.outputs.fps }} --cuadros ${{ needs.planificar.outputs.total }} | tee video.json
          python3 -c "import json,sys; v=json.load(open('video.json')); sys.exit(0 if v['ok'] else '::error::MP4 inválido: ' + '; '.join(v['problemas']))"
          python3 - <<'PY'
          import json
          r = json.load(open("salida/informe_rendimiento.json"))
          r["version"] = "${{ inputs.tag }}"; r["verificacion_video"] = json.load(open("video.json"))
          r["recuperacion"] = "${{ inputs.corrida_previa }}" or None
          r["manifiesto"] = json.load(open("version/manifest.json"))["archivos"]
          json.dump(r, open("salida/${{ needs.planificar.outputs.mp4 }}_informe.json", "w"), indent=1, ensure_ascii=False)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with: {name: entrega, path: "salida/\nverificacion.json", retention-days: 30}
      - name: Entregar el MP4 final en la Release de la versión (no se sobrescribe)
        run: |
          set -e
          N="${{ needs.planificar.outputs.mp4 }}"
          if gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -qx "$N.mp4"; then
            echo "::error::$TAG ya tiene $N.mp4: no se sobrescribe."; exit 1
          fi
          gh release upload "$TAG" --repo "$REPO" "salida/$N.mp4" "salida/${N}_informe.json"
          echo "### MP4 final entregado: $N.mp4 en la Release $TAG" >> "$GITHUB_STEP_SUMMARY"
